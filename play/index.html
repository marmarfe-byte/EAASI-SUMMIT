<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10162A">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<title>Cloud Invaders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one arcade cabinet screen (640x800 logical) scaled to fit the viewport, nothing else on the page.
   Deliberately single-theme: a dark arcade screen in the EAASI navy/teal palette. */
:root{
  --bg:#10162A; --navy:#1A2340; --mid:#2B3A67; --teal:#3DBFBF; --steel:#9AABC2;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--steel);margin:0;overflow:hidden;font-family:var(--pixel)}
.wrap{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;border-radius:6px;
  box-shadow:0 0 0 1px var(--mid), 0 24px 60px rgba(0,0,0,.45);background:var(--navy)}
canvas:focus-visible{box-shadow:0 0 0 3px var(--teal), 0 24px 60px rgba(0,0,0,.45)}
[hidden]{display:none!important}
.stage{position:relative}
.back{font-family:var(--pixel);font-size:10px;color:var(--steel);text-decoration:none;letter-spacing:.04em;padding:6px 2px}
.back:hover,.back:focus-visible{color:var(--teal)}
.lb-form{position:absolute;left:9%;right:9%;top:49%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:16px;
  background:rgba(26,35,64,.97);border:2px solid var(--teal);border-radius:8px;font-family:var(--pixel)}
.lb-form label{font-size:clamp(8px,1.5vh,11px);line-height:1.7;color:var(--teal);text-align:center}
.lb-form input{font-family:var(--pixel);font-size:16px;text-transform:uppercase;text-align:center;padding:10px 8px;min-width:0;
  background:var(--bg);color:#fff;border:1px solid var(--mid);border-radius:4px}
.lb-form input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.lb-form .row{display:flex;gap:10px}
.lb-form button{flex:1;font-family:var(--pixel);font-size:11px;padding:11px 6px;border-radius:4px;cursor:pointer;border:1px solid var(--teal)}
.lb-form .send{background:var(--teal);color:var(--bg)}
.lb-form .skip{background:transparent;color:var(--teal)}
.lb-form button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lb-form .msg{font-size:9px;line-height:1.6;color:var(--steel);text-align:center;min-height:1em}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <a class="back" id="back" href="/">&lt; EAASI SUMMIT APP</a>
  <div class="stage" id="stage">
  <canvas id="game" tabindex="0" aria-label="Cloud Invaders, an EAASI Partners Summit 2026 arcade game. Arrow keys move, Space fires, Enter starts. On touch screens, drag on the left half to steer and touch the right half to fire."></canvas>
  <form class="lb-form" id="lbForm" hidden autocomplete="off">
    <label for="lbName">NEW SCORE! ENTER YOUR NAME FOR THE TOP PILOTS BOARD</label>
    <input id="lbName" name="name" maxlength="14" required spellcheck="false" placeholder="YOUR NAME">
    <div class="row"><button class="send" type="submit">SEND</button><button class="skip" type="button" id="lbSkip">SKIP</button></div>
    <div class="msg" id="lbMsg" aria-live="polite"></div>
  </form>
  </div>
</div>

const LB_ON = /^https:\/\//.test(LEADERBOARD.url) && LEADERBOARD.key.length > 20;
const PLANE_CODE = { p68:"P68", da62:"DA62", c421:"C421", b350:"KA350" };
const lb = { top:null, rank:null, myId:null };
function lbHeaders(extra = {}) {
  const h = { apikey:LEADERBOARD.key, ...extra };
  if (LEADERBOARD.key.startsWith("eyJ")) h.Authorization = "Bearer " + LEADERBOARD.key;   // legacy anon JWT
  return h;
}
async function lbRefresh() {
  if (!LB_ON) return;
  try {
    const r = await fetch(`${LEADERBOARD.url}/rest/v1/scores?select=id,name,score,wave,plane&order=score.desc,created_at.asc&limit=10`, { headers:lbHeaders() });
    if (r.ok) lb.top = await r.json();
  } catch (e) {}
}
async function lbSubmit(name, score, wave, plane) {
  const r = await fetch(`${LEADERBOARD.url}/rest/v1/rpc/submit_score`, {
    method:"POST", headers:lbHeaders({ "Content-Type":"application/json" }),
    body:JSON.stringify({ p_name:name, p_score:score, p_wave:wave, p_plane:plane }) });
  if (!r.ok) throw new Error("submit " + r.status);
  return r.json();
}
async function lbRank(score) {
  try {
    const r = await fetch(`${LEADERBOARD.url}/rest/v1/scores?select=id&score=gt.${score}`, { method:"HEAD", headers:lbHeaders({ Prefer:"count=exact" }) });
    const m = (r.headers.get("content-range") || "").match(/\/(\d+)/);
    return m ? Number(m[1]) + 1 : null;
  } catch (e) { return null; }
}

  return c;
}

}

}

function tone(f1, f2, dur, type = "square", vol = .04, delay = 0) {

const cv = document.getElementById("game"), ctx = cv.getContext("2d"), wrap = document.getElementById("wrap");

// ---------------------------------------------------------------- static background: sky, stars, Alicante skyline
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function buildBackground() {
  const c = document.createElement("canvas"); c.width = W * R; c.height = H * R;
  const x = c.getContext("2d"); x.scale(R, R);
  const gr = x.createRadialGradient(W / 2, H * .42, 40, W / 2, H * .42, H * .75);
  gr.addColorStop(0, C.navy); gr.addColorStop(1, C.bg);
  x.fillStyle = gr; x.fillRect(0, 0, W, H);
  const r = rng(7);
  for (let i = 0; i < 90; i++) {
    x.globalAlpha = [.18, .28, .4][Math.floor(r() * 3)];
    x.fillStyle = C.steel; x.fillRect(Math.floor(r() * W / 2) * 2, 70 + Math.floor(r() * 300) * 2, 2, 2);
  }
  x.globalAlpha = 1;
  // skyline band
  const q = 4, g0 = GROUND + 22, c1 = "rgba(42,143,143,.62)", c2 = "rgba(61,191,191,.45)";
  x.fillStyle = "rgba(42,143,143,.35)"; x.fillRect(0, g0, W, FOOT - g0);
  // Benacantil hill + Santa Barbara castle
  const cx = 520, hw = 140, hh = 44;
  x.fillStyle = c1;
  for (let px = cx - hw; px < cx + hw; px += q) {
    const h = Math.floor(hh * Math.pow(Math.cos((px - cx) / hw * Math.PI / 2), 1.4) / q) * q;
    x.fillRect(px, g0 - h, q, h);
  }
  const top = g0 - hh;
  x.fillRect(cx - 52, top - 20, 96, 22);
  for (let px = cx - 52; px < cx + 44; px += 2 * q) x.fillRect(px, top - 20 - q, q, q);
  x.fillRect(cx - 12, top - 36, 16, 16);
  x.fillRect(cx - 12, top - 40, q, q); x.fillRect(cx, top - 40, q, q);
  // city blocks
  let bx = 8; const r2 = rng(3);
  while (bx < cx - hw - 20) {
    const bw = [32, 40, 48, 56][Math.floor(r2() * 4)], bh = [16, 24, 32, 40][Math.floor(r2() * 4)];
    x.fillStyle = c1; x.fillRect(bx, g0 - bh, bw, bh);
    x.fillStyle = c2;
    for (let wy = g0 - bh + 6; wy < g0 - 4; wy += 8) for (let wx = bx + 5; wx < bx + bw - 4; wx += 9) if (r2() < .45) x.fillRect(wx, wy, 3, 3);
    bx += bw + [4, 8, 12][Math.floor(r2() * 3)];
  }
  // palms
  x.fillStyle = c1;
  for (const px of [210, 300, 640 - 18]) {
    x.fillRect(px, g0 - 36, q, 36);
    for (const [dx, dy] of [[-16,-36],[-12,-40],[-8,-40],[-4,-40],[4,-40],[8,-40],[12,-36],[16,-32],[-20,-32],[0,-44]]) x.fillRect(px + dx, g0 + dy, q, q);
  }
  // footer band
  x.fillStyle = C.mid; x.fillRect(0, FOOT, W, H - FOOT);
  x.font = `8px ${FONT}`; x.fillStyle = C.steel; x.textBaseline = "middle"; x.textAlign = "left";
  x.fillText("EAASI PARTNERS SUMMIT 2026 · ALICANTE", 14, FOOT + 15);
  return c;
}

// ---------------------------------------------------------------- input
const keys = { left:false, right:false, fire:false };
const touch = { active:false, x:W / 2 };          // mouse: drag steers (absolute) and fires
// Touch screens: left half steers by relative drag, right half fires (hold = repeat, tap = one shot)

let paused = false;

// ---------------------------------------------------------------- game state
let state = "title", st = 0, sel = save.sel, g = null, clock = 0;

function newGame() {
  const pl = PLANES[sel];
  save.sel = sel; persist();
  g = { pl, score:0, lives:pl.lives, wave:0, parts:[], pops:[] };
  SFX.start(); nextWave();
}
function nextWave() {
  g.wave++;
  g.clouds = [];
  ["storm", "cumulus", "cumulus", "small"].forEach((k, r) => { for (let c = 0; c < 8; c++) g.clouds.push({ k, r, c, alive:true }); });
  g.total = g.clouds.length;
  g.ox = (W - (7 * 64 + 56)) / 2; g.oy = 110 + Math.min(g.wave - 1, 6) * 16;
  g.dir = 1; g.acc = 0; g.anim = 0; g.stepN = 0;
  g.px = W / 2; g.shots = []; g.drops = []; g.splash = []; g.cool = .3; g.dropAcc = 0;
  g.ufo = null; g.ufoT = 10 + Math.random() * 8; g.ufoCount = 0; g.inv = 1.6; g.respawn = 0; g.dying = 0;
  state = "play"; st = 0;
}
const cloudX = cl => g.ox + cl.c * 64 + (56 - SPR[cl.k].w) / 2;
const cloudY = cl => g.oy + cl.r * 44 + (36 - SPR[cl.k].h) / 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function burst(x, y, rows, map, p = P) {
  pixels(rows, map).forEach(([px, py, col], i) => {
    if (i % 2) return;
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 160;
    g.parts.push({ x:x + px * p, y:y + py * p, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 60, c:col, t:0, s:p });
  });
}
function fire() {
  const pl = g.pl, y = PLAYER_Y - 30;
  if (pl.beams === 1) g.shots.push({ x:g.px, y, vx:0 });
  else if (pl.beams === 2) { g.shots.push({ x:g.px - 14, y:y + 8, vx:0 }, { x:g.px + 14, y:y + 8, vx:0 }); }
  else { g.shots.push({ x:g.px, y, vx:0 }, { x:g.px - 12, y:y + 6, vx:-70 }, { x:g.px + 12, y:y + 6, vx:70 }); }
  g.cool = pl.cool; SFX.shoot();
}
function playerHit() {
  burst(g.px - g.pl.spr.width / 2, PLAYER_Y - g.pl.spr.height / 2, g.pl.rows, g.pl.map);
  g.lives--; g.drops = []; SFX.die();
  if (g.lives <= 0) { g.dying = 1.4; } else { g.respawn = 1.3; }
}
function gameOver(reason) {
  g.reason = reason; state = "over"; st = 0; g.lbAsked = false; g.lbDone = !LB_ON || g.score <= 0;
  lb.myId = null; lb.rank = null;
  if (g.score > save.hi) { save.hi = g.score; g.newHi = true; }
  persist();
}
function waveClear() {
  g.bonus = 100 * g.wave + 50 * g.lives; g.score += g.bonus;
  g.newly = PLANES.map((p, i) => i).filter(i => PLANES[i].unlock > 0 && g.wave >= PLANES[i].unlock && save.unlocked < PLANES[i].unlock);
  save.unlocked = Math.max(save.unlocked, g.wave);
  if (g.score > save.hi) save.hi = g.score;
  persist();
  state = "clear"; st = 0; g.shots = []; g.drops = []; g.ufo = null;
  // a new aircraft opens the picker with it preselected; the wave waits for the choice
  g.picking = g.newly.length > 0;
  g.pickSel = g.newly.length ? g.newly[g.newly.length - 1] : PLANES.indexOf(g.pl);
  SFX.clear(); if (g.newly.length) SFX.unlock();
}
const ownedPlanes = () => PLANES.map((p, i) => i).filter(isUnlocked);
function openPicker() { g.picking = true; g.pickSel = PLANES.indexOf(g.pl); st = Math.max(st, 1.1); SFX.blip(); }
function movePick(d) { const o = ownedPlanes(); g.pickSel = o[(o.indexOf(g.pickSel) + d + o.length) % o.length]; SFX.blip(); }
function choosePlane(i) {
  if (!isUnlocked(i)) { SFX.nope(); return; }
  const nw = PLANES[i];
  if (nw !== g.pl) {
    // switching to a sturdier aircraft adds its extra lives once per run
    g.livesCap = Math.max(g.livesCap || g.pl.lives, g.pl.lives);
    if (nw.lives > g.livesCap) { g.lives += nw.lives - g.livesCap; g.livesCap = nw.lives; }
    g.pl = nw; sel = i; save.sel = i; persist(); SFX.start();
  } else SFX.blip();
  g.picking = false; nextWave();
}

function update(dt) {
  st += dt; clock += dt;
  if (g) {
    for (const p of g.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; p.t += dt; }
    g.parts = g.parts.filter(p => p.t < .8);
    for (const q of g.pops) q.t += dt;
    g.pops = g.pops.filter(q => q.t < (q.big ? 1.6 : .8));
  }
  if (state === "clear" && !g.picking && st > 3.4) nextWave();
  if (state !== "play") return;

  const pl = g.pl;
  if (g.dying > 0) { g.dying -= dt; if (g.dying <= 0) gameOver("RAIN GROUNDED THE FLIGHT"); return; }
  const alive = g.clouds.filter(c => c.alive);
  if (!alive.length && !g.ufo) { waveClear(); return; }

  // formation: discrete steps, faster as it thins out and wave by wave
  if (alive.length) {
    const interval = (.05 + .6 * alive.length / g.total) / (1 + .12 * (g.wave - 1));
    g.acc += dt;
    if (g.acc >= interval) {
      g.acc -= interval; g.anim++; SFX.step(g.stepN++);
      let lo = 1e9, hi = -1e9;
      for (const c of alive) { lo = Math.min(lo, cloudX(c)); hi = Math.max(hi, cloudX(c) + SPR[c.k].w); }
      if ((g.dir > 0 && hi + 8 > W - 14) || (g.dir < 0 && lo - 8 < 14)) { g.dir *= -1; g.oy += 14; }
      else g.ox += 8 * g.dir;
    }
    if (alive.some(c => cloudY(c) + SPR[c.k].h >= PLAYER_Y - 30)) { burst(g.px - pl.spr.width / 2, PLAYER_Y - 28, pl.rows, pl.map); SFX.die(); gameOver("LOW CLOUD - IMC CONDITIONS"); return; }
  }

  // jammer UFO
  g.ufoT -= dt;
  if (!g.ufo && g.ufoT <= 0 && alive.length > 4 && g.ufoCount < 2) {
    g.ufoCount++;
    const d = Math.random() < .5 ? 1 : -1;
    g.ufo = { x: d > 0 ? -70 : W + 6, y: 78, v: 100 * d }; g.ufoT = 18 + Math.random() * 10; SFX.ufo();
  }
  if (g.ufo) { g.ufo.x += g.ufo.v * dt; if (g.ufo.x < -80 || g.ufo.x > W + 20) g.ufo = null; }

  // player
  if (g.respawn > 0) { g.respawn -= dt; if (g.respawn <= 0) { g.inv = 2; g.px = W / 2; } }
  else {
    let mv = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (touch.active) { const d = touch.x - g.px; mv = Math.abs(d) < 3 ? 0 : Math.sign(d) * Math.min(1, Math.abs(d) / 24); }

    pad2.dx = pad2.steerId === null ? 0 : (want - step) / 1.5;

    if (nx < 34 || nx > W - 34) pad2.dx = 0;
    g.px = clamp(nx, 34, W - 34);
    g.cool -= dt; g.inv -= dt;
    if ((keys.fire || touch.active || pad2.fire.size || pad2.queued) && g.cool <= 0 && g.shots.length + pl.beams <= pl.maxBul) { fire(); pad2.queued = false; }
  }

    if (s.y < 60) return false;
    if (g.ufo && s.x >= g.ufo.x && s.x <= g.ufo.x + 64 && s.y >= g.ufo.y && s.y <= g.ufo.y + 24) {
      const pts = [50, 100, 150, 300][Math.floor(Math.random() * 4)];
      g.score += pts; burst(g.ufo.x, g.ufo.y, CLOUDS.jammer.frames[0], CLOUDS.jammer.map);
      g.pops.push({ x:g.ufo.x + 32, y:g.ufo.y, txt:`JAMMER DOWN +${pts}`, t:0, big:true });
      g.ufo = null; SFX.ufoHit(); return false;
    }

        burst(x, y, CLOUDS[c.k].frames[g.anim % 2], CLOUDS[c.k].map);
        g.pops.push({ x:x + sp.w / 2, y, txt:"+" + CLOUDS[c.k].pts, t:0 });

      }
    }

  });

  const every = Math.max(.32, 1.25 - .11 * (g.wave - 1));
  if (alive.length && g.dropAcc > every) {
    g.dropAcc = 0;
    const low = {};
    for (const c of alive) if (!low[c.c] || c.r > low[c.c].r) low[c.c] = c;
    const cols = Object.values(low), c = cols[Math.floor(Math.random() * cols.length)];

    g.drops.push({ x:cloudX(c) + SPR[c.k].w / 2, y:cloudY(c) + SPR[c.k].h, v:(140 + 14 * g.wave) * (bolt ? 1.5 : 1), bolt });

    if (d.y > GROUND + 18) { g.splash.push({ x:d.x, t:0 }); return false; }
    return true;
  });

}

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
const hits = [];   // tap regions for the current screen
function button(label, x, y, w, h, enabled, action) {
  roundRect(x, y, w, h, 6); ctx.fillStyle = enabled ? C.teal : C.mid; ctx.fill();
  text(label, x + w / 2, y + h / 2 + 1, 14, enabled ? C.bg : C.steel);
  hits.push({ x, y, w, h, action });
}

function drawHUD() {
  text("SCORE " + pad(g ? g.score : 0), 16, 26, 12, C.white, "left");
  if (g) text("WAVE " + String(g.wave).padStart(2, "0"), W / 2, 26, 12, C.teal);
  text("HI " + pad(Math.max(save.hi, g ? g.score : 0)), W - 16, 26, 12, C.white, "right");
  if (g) {
    for (let i = 0; i < Math.max(0, g.lives - 1); i++) ctx.drawImage(g.pl.mini, 16 + i * 38, 42);
    text(g.pl.short, W - 16, 52, 8, C.steel, "right");
  }
}
function drawTouchPad() {
  if (!pad2.used || state !== "play" || paused) return;
  const y = GROUND + 30, on = pad2.fire.size > 0, st2 = pad2.steerId !== null;
  ctx.globalAlpha = .9;
  ctx.fillStyle = "rgba(16,22,42,.55)"; ctx.fillRect(W / 2 - 1, GROUND + 4, 2, FOOT - GROUND - 8);
  text("< DRAG TO STEER >", W / 4, y, 10, st2 ? C.teal : C.peri);
  ctx.fillStyle = on ? C.teal : "rgba(16,22,42,.7)"; ctx.fillRect(W * 3 / 4 - 70, y - 17, 140, 34);
  ctx.strokeStyle = C.teal; ctx.lineWidth = 2; ctx.strokeRect(W * 3 / 4 - 70, y - 17, 140, 34);
  text("FIRE", W * 3 / 4, y, 12, on ? C.navy : C.teal);
  ctx.globalAlpha = 1;
}
function drawFooter() {
  text(save.mute ? "SOUND OFF" : "SOUND ON", W - 14, FOOT + 15, 8, save.mute ? C.steel : C.teal, "right");
  hits.push({ x:W - 120, y:FOOT, w:120, h:H - FOOT, action:() => { save.mute = !save.mute; persist(); if (!save.mute) SFX.blip(); } });
}

function drawWorld() {
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, FOOT); ctx.clip();
  for (const c of g.clouds) if (c.alive) ctx.drawImage(SPR[c.k][g.anim % 2], Math.round(cloudX(c)), Math.round(cloudY(c)));
  if (g.ufo) {
    text("JAMMER", g.ufo.x + 32, g.ufo.y - 10, 8, C.steel);
    ctx.drawImage(SPR.jammer[Math.floor(clock * 6) % 2], Math.round(g.ufo.x), g.ufo.y);
  }
  for (const s of g.shots) { ctx.fillStyle = C.teal; ctx.fillRect(s.x - 1.5, s.y, 3, 7); ctx.globalAlpha = .55; ctx.fillRect(s.x - 1.5, s.y + 10, 3, 5); ctx.globalAlpha = 1; }
  for (const d of g.drops) {
    if (d.bolt) { ctx.fillStyle = C.white; ctx.fillRect(d.x - 1, d.y, 3, 5); ctx.fillRect(d.x + 2, d.y + 5, 3, 5); ctx.fillRect(d.x - 1, d.y + 10, 3, 5); }
    else { ctx.fillStyle = C.rain; ctx.fillRect(d.x - 1, d.y, 3, 9); }
  }
  for (const s of g.splash) {
    ctx.globalAlpha = 1 - s.t / .4; ctx.fillStyle = C.rain; const o = 4 + s.t * 30;
    ctx.fillRect(s.x - o, GROUND + 14, 3, 3); ctx.fillRect(s.x - 1, GROUND + 10, 3, 3); ctx.fillRect(s.x + o, GROUND + 14, 3, 3); ctx.globalAlpha = 1;
  }
  const showPlayer = state === "play" ? (g.respawn <= 0 && g.dying <= 0 && (g.inv <= 0 || Math.floor(clock * 10) % 2 === 0)) : state === "clear";
  if (showPlayer) ctx.drawImage(g.pl.spr, Math.round(g.px - g.pl.spr.width / 2), Math.round(PLAYER_Y - g.pl.spr.height / 2));
  for (const p of g.parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / .8); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s - 1, p.s - 1); }
  ctx.globalAlpha = 1;
  for (const q of g.pops) {
    const life = q.big ? 1.6 : .8;
    text(q.txt, q.x, q.y - 26 * q.t, q.big ? 12 : 8, q.big ? C.teal : C.white, "center", 1 - Math.pow(q.t / life, 2));
  }
  ctx.restore();
}

function drawTitle() {
  if (LOGO.complete && LOGO.naturalWidth) {
    const w = 360, h = w * LOGO.naturalHeight / LOGO.naturalWidth;
    ctx.imageSmoothingEnabled = true; ctx.drawImage(LOGO, (W - w) / 2, 84, w, h); ctx.imageSmoothingEnabled = false;
  }
  text("CLOUD INVADERS", W / 2, 218, 36, C.teal);
  text("AN EAASI PARTNERS SUMMIT 2026 ARCADE", W / 2, 258, 10, C.steel);
  if (LB_ON && lb.top && lb.top.length && Math.floor(clock / 7) % 2 === 1) {
    drawBoard(300, null);
  } else {
  text("* SCORE ADVANCE TABLE *", W / 2, 312, 10, C.white);
  const rows = [["jammer", "= ? MYSTERY"], ["storm", "= 40 POINTS"], ["cumulus", "= 20 POINTS"], ["small", "= 10 POINTS"]];
  rows.forEach(([k, l], i) => {
    const y = 358 + i * 50, sp = SPR[k][Math.floor(clock * 2) % 2];
    ctx.drawImage(sp, W / 2 - 150 - sp.width / 2, y - sp.height / 2);
    text(l, W / 2 - 80, y, 12, C.white, "left");
  });
  }
  if (blink()) text("PRESS ENTER OR TAP TO START", W / 2, 578, 12, C.teal);
  text("ARROWS MOVE  ·  SPACE FIRES  ·  P PAUSE", W / 2, 620, 8, C.steel);
  text("TOUCH: LEFT SIDE STEERS  ·  RIGHT SIDE FIRES", W / 2, 640, 8, C.steel);
  const n = PLANES.filter((p, i) => isUnlocked(i)).length;
  text(`AIRCRAFT UNLOCKED ${n}/${PLANES.length}`, W / 2, 682, 10, C.white);
  hits.push({ x:0, y:0, w:W, h:FOOT, action:goHangar });
}

function drawHangar() {
  text("CHOOSE YOUR AIRCRAFT", W / 2, 92, 16, C.teal);
  text("CLEAR WAVES TO UNLOCK BIGGER SURVEY PLATFORMS", W / 2, 118, 8, C.steel);
  PLANES.forEach((pl, i) => {
    const cw = 290, ch = 246, x = 20 + (i % 2) * 310, y = 140 + Math.floor(i / 2) * 262, un = isUnlocked(i), on = sel === i;
    roundRect(x, y, cw, ch, 8); ctx.fillStyle = un ? "rgba(43,58,103,.55)" : "rgba(26,35,64,.6)"; ctx.fill();
    ctx.lineWidth = on ? 3 : 1; ctx.strokeStyle = on ? C.teal : C.mid; ctx.stroke();
    const sp = un ? pl.big : pl.dark;
    ctx.drawImage(sp, x + cw / 2 - sp.width / 2, y + 16);
    text(pl.line1, x + cw / 2, y + 108, 10, un ? C.white : C.slate);
    text(pl.line2, x + cw / 2, y + 126, 10, un ? C.white : C.slate);
    if (un) {
      const bars = [["SPEED", Math.round((pl.speed - 200) / 20)], ["PULSE RATE", Math.round((.6 - pl.cool) / .055)]];
      bars.forEach(([l, v], j) => {
        const by = y + 152 + j * 22;
        text(l, x + 18, by, 8, C.steel, "left");
        for (let b = 0; b < 5; b++) { ctx.fillStyle = b < v ? C.teal : C.mid; ctx.fillRect(x + 150 + b * 24, by - 5, 20, 10); }
      });
      text(`LIDAR BEAMS x${pl.beams}`, x + 18, y + 200, 8, C.steel, "left");
      text(`LIVES ${pl.lives}`, x + cw - 18, y + 200, 8, C.steel, "right");
      if (on) text("SELECTED", x + cw / 2, y + 228, 8, C.teal);
    } else {
      text("LOCKED", x + cw / 2, y + 170, 12, C.slate);
      text(`CLEAR WAVE ${pl.unlock} TO UNLOCK`, x + cw / 2, y + 196, 8, C.steel);
    }
    hits.push({ x, y, w:cw, h:ch, action:() => { if (sel !== i) { sel = i; SFX.blip(); } else if (un) newGame(); } });
  });
  const ok = isUnlocked(sel);
  button(ok ? "TAKE OFF" : "LOCKED", W / 2 - 120, 670, 240, 44, ok, () => ok ? newGame() : SFX.nope());
  text("ARROWS SELECT  ·  ENTER TAKE OFF", W / 2, 738, 8, C.white);
}

function drawClear() {
  const k = Math.min(1, st / .25);
  if (st > 1 || blink(6)) text("CAVOK!", W / 2, 250, 56, C.teal, "center", k);
  text("CEILING AND VISIBILITY OK", W / 2, 312, 12, C.white, "center", Math.min(1, Math.max(0, (st - .5) / .4)));
  text(`WAVE ${g.wave} CLEARED  +${g.bonus}`, W / 2, 344, 10, C.steel, "center", Math.min(1, Math.max(0, (st - .9) / .4)));
  const owned = ownedPlanes();
  if (g.picking && st > 1) drawPicker(owned, Math.min(1, (st - 1) / .35));
  else if (!g.picking && owned.length > 1 && st > .9)
    button("CHANGE AIRCRAFT (C)", W / 2 - 160, 400, 320, 40, true, openPicker);
}

const PICK_CODE = { p68:"P68", da62:"DA62", c421:"C421", b350:"KING AIR" };
function drawPicker(owned, a) {
  ctx.globalAlpha = a;
  roundRect(36, 376, W - 72, 318, 8); ctx.fillStyle = "rgba(26,35,64,.95)"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = C.teal; ctx.stroke(); ctx.globalAlpha = 1;
  const isNew = g.newly.length > 0, np = isNew ? PLANES[g.newly[g.newly.length - 1]] : null;
  text(isNew ? "NEW AIRCRAFT UNLOCKED!" : "CHANGE AIRCRAFT", W / 2, 402, 12, C.teal, "center", isNew && !blink(4) ? a * .6 : a);
  text(isNew ? `${np.line1} ${np.line2}` : "PICK THE AIRCRAFT FOR THE NEXT WAVE", W / 2, 426, isNew ? 10 : 8, C.white, "center", a);
  const cw = 118, gap = 12, n = owned.length, x0 = W / 2 - (n * cw + (n - 1) * gap) / 2, y = 446;
  owned.forEach((i, k) => {
    const pl = PLANES[i], x = x0 + k * (cw + gap), on = g.pickSel === i;
    ctx.globalAlpha = a;
    roundRect(x, y, cw, 140, 6); ctx.fillStyle = on ? "rgba(61,191,191,.18)" : "rgba(43,58,103,.6)"; ctx.fill();
    ctx.lineWidth = on ? 3 : 1; ctx.strokeStyle = on ? C.teal : C.mid; ctx.stroke();
    ctx.drawImage(pl.spr, Math.round(x + cw / 2 - pl.spr.width / 2), y + 14); ctx.globalAlpha = 1;
    text(PICK_CODE[pl.id], x + cw / 2, y + 100, 8, on ? C.teal : C.white, "center", a);
    if (pl === g.pl) text("IN USE", x + cw / 2, y + 122, 8, C.steel, "center", a);
    else if (isNew && i === g.newly[g.newly.length - 1]) text("NEW!", x + cw / 2, y + 122, 8, C.teal, "center", blink(4) ? a : a * .5);
    hits.push({ x, y, w:cw, h:140, action:() => { if (st < 1.2) return; if (g.pickSel === i) choosePlane(i); else { g.pickSel = i; SFX.blip(); } } });
  });
  const keep = g.pickSel === PLANES.indexOf(g.pl);
  button(keep ? "KEEP THIS AIRCRAFT" : "FLY THIS AIRCRAFT", W / 2 - 160, 604, 320, 40, true, () => { if (st >= 1.2) choosePlane(g.pickSel); });
  text("ARROWS CHOOSE  ·  ENTER CONFIRM", W / 2, 670, 8, C.steel, "center", a);
}

function drawBoard(y0, hiId) {
  text("* TOP PILOTS *", W / 2, y0 + 12, 12, C.teal);
  const rows = lb.top || [];
  if (!rows.length) { text("NO SCORES YET. BE THE FIRST!", W / 2, y0 + 60, 10, C.white); return; }
  rows.slice(0, 10).forEach((r, i) => {
    const y = y0 + 46 + i * 22, me = hiId && r.id === hiId, col = me ? C.teal : C.white;
    if (me && blink(4)) { ctx.fillStyle = "rgba(61,191,191,.15)"; ctx.fillRect(70, y - 10, W - 140, 20); }
    text(String(i + 1).padStart(2, " ") + ".", 120, y, 10, i < 3 ? C.teal : C.steel, "right");
    text(String(r.name).slice(0, 14), 136, y, 10, col, "left");
    text(pad(r.score, 6), 470, y, 10, col, "right");
    text(PLANE_CODE[r.plane] || "", 490, y, 8, C.steel, "left");
  });
}

function drawOver() {
  const a = Math.min(1, st / .4);
  ctx.fillStyle = `rgba(16,22,42,${Math.min(.88, st / 1.2)})`; ctx.fillRect(0, 60, W, FOOT - 60);
  text("FLIGHT CANCELLED", W / 2, 170, 24, C.teal, "center", a);
  text(g.reason, W / 2, 206, 10, C.white, "center", a);
  text(`SCORE ${pad(g.score)}`, W / 2, 256, 14, C.white, "center", a);
  text(g.newHi ? "NEW HI-SCORE!" : `HI-SCORE ${pad(save.hi)}`, W / 2, 286, 10, g.newHi ? C.teal : C.steel, "center", a);
  text(`WAVES CLEARED ${g.wave - 1}`, W / 2, 312, 10, C.steel, "center", a);
  const next = PLANES.find(p => p.unlock > save.unlocked);
  text(next ? `NEXT UNLOCK: ${next.short} AT WAVE ${next.unlock}` : "ALL AIRCRAFT UNLOCKED, CAPTAIN!", W / 2, 342, 8, C.white, "center", a);
  if (st > 1 && !g.lbAsked && !g.lbDone) openEntry();
  if (g.lbDone) {
    if (LB_ON && lb.top) {
      drawBoard(372, lb.myId);
      if (lb.rank && lb.rank > 10) text(`YOUR RANK: #${lb.rank}`, W / 2, 648, 10, C.teal);
    }
    if (st > 1 && blink()) text("PRESS ENTER OR TAP TO FLY AGAIN", W / 2, LB_ON && lb.top ? 690 : 420, 12, C.teal);
    if (st > 1) hits.push({ x:0, y:0, w:W, h:FOOT, action:goHangar });
  }
}

// ---------------------------------------------------------------- name entry (HTML form over the canvas)
const form = document.getElementById("lbForm"), nameIn = document.getElementById("lbName"), msg = document.getElementById("lbMsg");
function openEntry() {
  g.lbAsked = true; form.hidden = false; msg.textContent = "";
  nameIn.value = save.name || "";
  setTimeout(() => { try { nameIn.focus({ preventScroll:true }); nameIn.select(); } catch (e) {} }, 30);
}
function closeEntry() { form.hidden = true; g.lbDone = true; st = Math.max(st, 1); cv.focus({ preventScroll:true }); }
form.addEventListener("submit", async e => {
  e.preventDefault();
  const name = nameIn.value.toUpperCase().replace(/\s+/g, " ").trim();
  if (!/^[A-Z0-9 .&\-]{2,14}$/.test(name)) { msg.textContent = "USE 2-14 LETTERS OR NUMBERS"; return; }
  msg.textContent = "SENDING..."; form.querySelector(".send").disabled = true;
  try {
    const id = await lbSubmit(name, g.score, g.wave, g.pl.id);
    save.name = name; persist();
    lb.myId = typeof id === "number" ? id : (Array.isArray(id) ? id[0] : id);
    await lbRefresh(); lb.rank = await lbRank(g.score);
    SFX.unlock(); closeEntry();
  } catch (err) {
    msg.textContent = "COULD NOT SEND THE SCORE. CHECK THE CONNECTION AND TRY AGAIN.";
  } finally { form.querySelector(".send").disabled = false; }
});
document.getElementById("lbSkip").addEventListener("click", closeEntry);

function draw() {
  hits.length = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgLayer, 0, 0);
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (state === "title") drawTitle();
  else if (state === "hangar") drawHangar();
  else { drawHUD(); drawWorld(); if (state === "clear") drawClear(); if (state === "over") drawOver(); }
  if (state === "title" || state === "hangar") text("HI " + pad(save.hi), W - 16, 26, 10, C.steel, "right");
  if (paused) {
    ctx.fillStyle = "rgba(16,22,42,.75)"; ctx.fillRect(0, 0, W, FOOT);
    text("PAUSED", W / 2, 360, 28, C.teal); text("PRESS P OR TAP TO RESUME", W / 2, 410, 10, C.white);
  }
  drawTouchPad();
  drawFooter();
  // CRT scanlines
  ctx.fillStyle = "rgba(0,0,0,.12)";
  for (let y = 0; y < FOOT; y += 4) ctx.fillRect(0, y, W, 1);
}

// ---------------------------------------------------------------- flow
function goHangar() { form.hidden = true; state = "hangar"; st = 0; SFX.blip(); lbRefresh(); }
function primary() {
  if (paused) { paused = false; return; }
  if (state === "title") goHangar();
  else if (state === "hangar") { if (isUnlocked(sel)) newGame(); else SFX.nope(); }
  else if (state === "over" && st > 1 && g.lbDone) goHangar();
  else if (state === "clear" && g.picking && st >= 1.2) choosePlane(g.pickSel);
}
const KEYMAP = { ArrowLeft:"left", KeyA:"left", ArrowRight:"right", KeyD:"right", Space:"fire", ArrowUp:"fire", KeyW:"fire", KeyZ:"fire" };
addEventListener("keydown", e => {
  if (e.target && e.target.closest && e.target.closest("form")) return;
  if (state === "over" && !form.hidden) return;
  if (KEYMAP[e.code] || e.code === "ArrowDown") e.preventDefault();
  if (state === "hangar" && !e.repeat) {
    if (e.code === "ArrowLeft" || e.code === "KeyA") { sel = (sel + 3) % 4; SFX.blip(); return; }
    if (e.code === "ArrowRight" || e.code === "KeyD") { sel = (sel + 1) % 4; SFX.blip(); return; }
    if (e.code === "ArrowUp" || e.code === "ArrowDown" || e.code === "KeyW" || e.code === "KeyS") { sel = (sel + 2) % 4; SFX.blip(); return; }
    if (e.code === "Escape") { state = "title"; st = 0; return; }
  }
  if (state === "clear" && g && !e.repeat) {
    if (g.picking) {
      if (e.code === "ArrowLeft" || e.code === "KeyA") { movePick(-1); return; }
      if (e.code === "ArrowRight" || e.code === "KeyD") { movePick(1); return; }
      if (e.code === "Escape" && st >= 1.2) { choosePlane(PLANES.indexOf(g.pl)); return; }
    } else if (e.code === "KeyC" && ownedPlanes().length > 1) { openPicker(); return; }
  }
  if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = true;
  if (!e.repeat && (e.code === "Enter" || (e.code === "Space" && state !== "play" && state !== "clear"))) primary();
  if ((e.code === "KeyP" || e.code === "Escape") && state === "play") paused = !paused;
  if (e.code === "KeyM") { save.mute = !save.mute; persist(); }
});
addEventListener("keyup", e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H }; }
cv.addEventListener("pointerdown", e => {
  cv.focus(); audio();
  const p = toLogical(e);
  if (paused) { paused = false; return; }
  const h = [...hits].reverse().find(h => p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h);
  if (state === "play" && !(h && p.y > FOOT)) {
    cv.setPointerCapture(e.pointerId);
    if (e.pointerType === "mouse") { touch.active = true; touch.x = p.x; return; }
    pad2.used = true;
    if (p.x < W / 2 && pad2.steerId === null) { pad2.steerId = e.pointerId; pad2.lastX = p.x; }
    else { pad2.fire.add(e.pointerId); pad2.queued = true; }
    return;
  }
  if (h) h.action();
});
cv.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse") { if (touch.active) touch.x = toLogical(e).x; return; }
  if (e.pointerId === pad2.steerId) { const x = toLogical(e).x; pad2.dx += x - pad2.lastX; pad2.lastX = x; }
});
const endTouch = e => {
  if (e.pointerType === "mouse") { touch.active = false; return; }
  if (e.pointerId === pad2.steerId) pad2.steerId = null;
  pad2.fire.delete(e.pointerId);
};
cv.addEventListener("pointerup", endTouch); cv.addEventListener("pointercancel", endTouch);
document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") paused = true; });
addEventListener("blur", () => { keys.left = keys.right = keys.fire = false; touch.active = false; pad2.steerId = null; pad2.fire.clear(); pad2.queued = false; });

new ResizeObserver(resize).observe(wrap);
resize();
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) { const n = Math.ceil(dt / (1 / 120)); for (let i = 0; i < n; i++) update(dt / n); } else clock += dt;
  draw();
  requestAnimationFrame(loop);
}
if (document.fonts && document.fonts.load) document.fonts.load(`12px ${FONT}`).then(() => { bgLayer = buildBackground(); }).catch(() => {});
lbRefresh(); setInterval(() => { if (state === "title") lbRefresh(); }, 60000);
requestAnimationFrame(loop);
cv.focus({ preventScroll:true });
})();
</script>
